name: Build QMK firmware

on:
    push: {}
    # Where the preview comment normally comes from. A branch is pushed before its pull
    # request is opened, so by then the `push` run has usually been and gone with no pull
    # request to comment on. `synchronize` is deliberately absent: every later push already
    # triggers a run of its own. The build is skipped for these, so they cost one `version`
    # job and one comment.
    pull_request:
        types: [opened, reopened]
    workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One run per branch at a time. The `release` job creates Git tags, and two runs racing on
# `main` would both see a tag missing before either of them creates it, so they must not overlap.
# On `main` a queued run therefore waits instead of cancelling, so a release is never killed
# half way through; on every other branch the newer push simply supersedes the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Each keymap has its own version ladder, so each one gets its own version, its own tag and
  # its own answer to "did this change at all". The two keymaps are handled by one job rather
  # than by a matrix because matrix jobs overwrite each other's outputs.
  version:
    name: 'Read firmware versions'
    runs-on: ubuntu-latest
    outputs:
      cozy_version:       ${{ steps.read.outputs.cozy_version }}
      cozy_tag_exists:    ${{ steps.read.outputs.cozy_tag_exists }}
      cozy_changed:       ${{ steps.read.outputs.cozy_changed }}
      cozy_release:       ${{ steps.read.outputs.cozy_release }}
      cozy_de_version:    ${{ steps.read.outputs.cozy_de_version }}
      cozy_de_tag_exists: ${{ steps.read.outputs.cozy_de_tag_exists }}
      cozy_de_changed:    ${{ steps.read.outputs.cozy_de_changed }}
      cozy_de_release:    ${{ steps.read.outputs.cozy_de_release }}
      any_changed:        ${{ steps.read.outputs.any_changed }}
      any_release:        ${{ steps.read.outputs.any_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The change detection below diffs against `main` or against the previous tip of
          # this branch, neither of which exists in the default depth-1 checkout.
          fetch-depth: 0

      - name: Read each keymap's version and see which keymaps changed
        id: read
        env:
          KEYMAP_DIR: keyboards/keebio/iris_ce/keymaps
          PUSHED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # What to diff against. On `main` the question is "did this push change the keymap";
          # on a branch it is "does this branch change the keymap", which is the question the
          # pull request comment wants answered and the one that still holds after the merge.
          # Hence the merge base (three dots) on a branch and the previous tip on `main`.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -n "$PUSHED_BEFORE" ] \
               && [ "$PUSHED_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSHED_BEFORE^{commit}" 2> /dev/null; then
              range="$PUSHED_BEFORE..HEAD"
            elif git rev-parse --verify --quiet 'HEAD^' > /dev/null; then
              # `workflow_dispatch` carries no `before`, so fall back to the single commit.
              range="HEAD^..HEAD"
            else
              range="$(git hash-object -t tree /dev/null)..HEAD"
            fi
          else
            range="origin/main...HEAD"
          fi
          echo "Comparing $range"

          # Anything under `keyboards/` that is not inside one of the keymap directories is
          # shared, so it counts as a change to both keymaps.
          shared=$(git diff --name-only "$range" -- keyboards/ \
                     ":(exclude)$KEYMAP_DIR/cozy" ":(exclude)$KEYMAP_DIR/cozy_de")
          if [ -n "$shared" ]; then
            echo "Shared files under keyboards/ changed, so both keymaps count as changed:"
            echo "$shared" | sed 's/^/  /'
          fi

          any_changed=false
          any_release=false
          for km in cozy cozy_de; do
            file="$KEYMAP_DIR/$km/keymap.c"

            raw=$(grep -E '^#define[[:space:]]+VERSION_STRING' "$file" | head -n 1 || true)
            version=$(printf '%s' "$raw" | grep -oE '[rR]ev[0-9][0-9A-Za-z._-]*' | head -n 1 || true)
            if [ -z "$version" ]; then
              echo "::error file=$file::VERSION_STRING has no rev<digit>... version in it"
              exit 1
            fi

            # The whole token is the version, suffix included, so that a tag says what changed
            # the way the hand-made tags used to. Trim it into something Git will accept as a
            # ref rather than letting `git tag` reject it minutes later: a ref may not contain
            # `..`, end in `.lock`, or end in a `.`. The character class above already ruled
            # out spaces, `~^:?*[` and the rest, so this is all that is left to do.
            version=$(printf '%s' "$version" | sed -E 's/\.{2,}/./g; s/\.lock$//; s/[._-]+$//')
            tag="$km-$version"
            # Never fires: the trim above makes the name legal by construction. It is here so
            # that a future edit to either of them cannot quietly reintroduce a broken tag.
            git check-ref-format "refs/tags/$tag"

            if git ls-remote --tags --exit-code origin "refs/tags/$tag" > /dev/null 2>&1; then
              tag_exists=true
            else
              tag_exists=false
            fi

            if [ -n "$shared" ] || [ -n "$(git diff --name-only "$range" -- "$KEYMAP_DIR/$km")" ]; then
              changed=true
              any_changed=true
            else
              changed=false
            fi

            # A keymap is released only when it changed *and* carries a version that was never
            # tagged. A change that leaves the version alone is not an error, it is a decision:
            # a comment, a refactor or a doc tweak nobody has to reflash for. It simply goes
            # unreleased, and its firmware is downloadable from this run's artifacts.
            if [ "$changed" = true ] && [ "$tag_exists" = false ]; then
              release=true
              any_release=true
            else
              release=false
            fi

            {
              echo "${km}_version=$version"
              echo "${km}_tag_exists=$tag_exists"
              echo "${km}_changed=$changed"
              echo "${km}_release=$release"
            } >> "$GITHUB_OUTPUT"
            echo "$km: tag=$tag already-released=$tag_exists changed=$changed will-release=$release"
          done
          {
            echo "any_changed=$any_changed"
            echo "any_release=$any_release"
          } >> "$GITHUB_OUTPUT"

  # Says on the pull request what merging it will and will not release, so that a typo in a
  # version suffix or a bump you did want is fixed while it is still cheap. It never gates the
  # merge: not bumping a version is a legitimate answer, and this comment is how you notice
  # that you gave it.
  pr-comment:
    name: 'Report the release preview'
    needs: [version]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          COZY_VERSION:       ${{ needs.version.outputs.cozy_version }}
          COZY_TAG_EXISTS:    ${{ needs.version.outputs.cozy_tag_exists }}
          COZY_CHANGED:       ${{ needs.version.outputs.cozy_changed }}
          COZY_DE_VERSION:    ${{ needs.version.outputs.cozy_de_version }}
          COZY_DE_TAG_EXISTS: ${{ needs.version.outputs.cozy_de_tag_exists }}
          COZY_DE_CHANGED:    ${{ needs.version.outputs.cozy_de_changed }}
          ANY_CHANGED:        ${{ needs.version.outputs.any_changed }}
        with:
          script: |
            const MARKER = '<!-- release-preview -->';
            const keymaps = [
              { name: 'cozy',    version: process.env.COZY_VERSION,
                changed: process.env.COZY_CHANGED === 'true',
                released: process.env.COZY_TAG_EXISTS === 'true' },
              { name: 'cozy_de', version: process.env.COZY_DE_VERSION,
                changed: process.env.COZY_DE_CHANGED === 'true',
                released: process.env.COZY_DE_TAG_EXISTS === 'true' },
            ];

            let body;
            if (process.env.ANY_CHANGED !== 'true') {
              body = [
                MARKER,
                '### Release preview',
                '',
                'This branch changes nothing under `keyboards/`, so merging it creates no tag',
                'and no release. Both firmwares are still built, and downloadable from the',
                'workflow run for the latest push.',
              ].join('\n');
            } else {
              // Only a changed keymap carrying a never-tagged version is released; the other
              // three combinations are all fine, so each row says what merging does, not what
              // is wrong with the branch.
              const anyRelease = keymaps.some(k => k.changed && !k.released);
              const rows = keymaps.map(k => {
                if (k.changed && !k.released) return `| \`${k.name}\` | \`${k.name}-${k.version}\` |`;
                if (k.changed) return `| \`${k.name}\` | — none: \`${k.version}\` is already released |`;
                if (anyRelease) return `| \`${k.name}\` | — unchanged, re-released as \`${k.version}\` |`;
                return `| \`${k.name}\` | — unchanged |`;
              });
              body = [
                MARKER,
                '### Release preview',
                '',
                '| keymap | tag created on merge |',
                '|---|---|',
                ...rows,
                '',
                anyRelease
                  ? 'Merging creates one release, on the first tag above, carrying both firmware files.'
                  : 'No version was bumped, so merging this creates no tag and no release. Both firmwares'
                    + ' are still built, and downloadable from the workflow run for the latest push. If you'
                    + ' do want a release, bump `VERSION_STRING` in the `keymap.c` of a changed keymap.',
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            // On a `pull_request` event `context.sha` is the ephemeral merge commit, which no
            // pull request is associated with, so the number has to come from the payload. On a
            // push there is no payload to read and the commit is the branch tip, which is.
            const numbers = context.payload.pull_request
              ? [context.payload.pull_request.number]
              : (await github.rest.repos.listPullRequestsAssociatedWithCommit(
                  { owner, repo, commit_sha: context.sha }))
                  .data.filter(p => p.state === 'open').map(p => p.number);
            core.info(`Commenting on: ${numbers.length ? numbers.join(', ') : '(no open pull request)'}`);

            for (const number of numbers) {
              try {
                const comments = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: number, per_page: 100 });
                // Edit the one comment this workflow owns rather than adding one per push.
                const mine = comments.find(c => c.body && c.body.includes(MARKER));
                if (!mine) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
                } else if (mine.body.trim() !== body.trim()) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
                }
              } catch (err) {
                // A pull request from a fork gets a read-only token. The preview is a
                // convenience, so say so and move on rather than failing the run.
                core.warning(`Could not comment on #${number}: ${err.message}`);
              }
            }

  # The key overrides are the one part of the keymap whose behavior is worth testing rather than
  # eyeballing: issue #14 was invisible in the source and only showed up in the HID reports, and
  # only when the *right* Shift was used. `tests/cozy_de_key_overrides/` drives QMK's real key
  # override code on the host, so it needs neither hardware nor an ARM toolchain, and it compiles
  # `cozy_de/key_overrides.h` itself rather than a copy that could drift.
  #
  # Runs on pull requests too, unlike `build`: it is a couple of minutes and it is the only check
  # that would catch a regression here before the firmware is flashed.
  key-override-tests:
    name: 'Key override tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out QMK and the two submodules the test harness needs
        run: |
          set -euo pipefail
          # Same ref the firmware is built against, so the tests exercise the code that ships.
          git clone --depth 1 --branch master https://github.com/qmk/qmk_firmware.git qmk
          git -C qmk submodule update --init --depth 1 lib/googletest lib/printf

      - name: Install the QMK CLI
        run: |
          set -euo pipefail
          # In a virtualenv with current build tooling: installed against the system Python, one
          # of milc's dependencies fails to build a wheel.
          python3 -m venv qmkvenv
          ./qmkvenv/bin/pip install --quiet --upgrade pip setuptools wheel
          ./qmkvenv/bin/pip install --quiet qmk

      - name: Run the key override tests
        run: |
          set -euo pipefail
          cp -r tests/cozy_de_key_overrides qmk/tests/
          cp keyboards/keebio/iris_ce/keymaps/cozy_de/key_overrides.h qmk/tests/cozy_de_key_overrides/
          export PATH="$PWD/qmkvenv/bin:$PATH"
          # SKIP_GIT: the submodule check wants submodules this shallow clone deliberately lacks.
          make -C qmk SKIP_GIT=yes test:cozy_de_key_overrides

  build:
    name: 'QMK Userspace Build'
    if: github.event_name != 'pull_request'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  # Renames both firmwares to downloadable names. Nothing in here fails over a version: an
  # unbumped keymap goes unreleased, and these artifacts are how you get its firmware anyway.
  package:
    name: 'Package firmware'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: Firmware
          path: firmware

      - name: Rename both firmwares
        env:
          COZY_VERSION:    ${{ needs.version.outputs.cozy_version }}
          COZY_DE_VERSION: ${{ needs.version.outputs.cozy_de_version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # `*cozy*` matches the cozy_de build as well, so the cozy lookup has to exclude it.
          cozy_src=$(find firmware -name '*cozy*.uf2' ! -name '*cozy_de*' | head -n 1)
          cozy_de_src=$(find firmware -name '*cozy_de*.uf2' | head -n 1)
          if [ -z "$cozy_src" ] || [ -z "$cozy_de_src" ]; then
            echo "::error::The build did not produce both .uf2 files (cozy='$cozy_src', cozy_de='$cozy_de_src')"
            find firmware -type f
            exit 1
          fi

          cp "$cozy_src"    "dist/iris-cozy-$COZY_VERSION.uf2"
          cp "$cozy_de_src" "dist/iris-cozy-de-$COZY_DE_VERSION.uf2"
          ls -l dist

      - name: Upload the cozy firmware
        uses: actions/upload-artifact@v4
        with:
          name: iris-cozy-${{ needs.version.outputs.cozy_version }}
          path: dist/iris-cozy-${{ needs.version.outputs.cozy_version }}.uf2
          if-no-files-found: error

      - name: Upload the cozy_de firmware
        uses: actions/upload-artifact@v4
        with:
          name: iris-cozy-de-${{ needs.version.outputs.cozy_de_version }}
          path: dist/iris-cozy-de-${{ needs.version.outputs.cozy_de_version }}.uf2
          if-no-files-found: error

      # A changed keymap that is still on a released version used to fail the build, which made
      # every comment fix cost a version bump. It is a notice now: the run is green, the two
      # artifacts above are the firmware, and only the tag and the Release are withheld.
      - name: Say which changed keymaps will not be released
        env:
          COZY_VERSION:       ${{ needs.version.outputs.cozy_version }}
          COZY_TAG_EXISTS:    ${{ needs.version.outputs.cozy_tag_exists }}
          COZY_CHANGED:       ${{ needs.version.outputs.cozy_changed }}
          COZY_DE_VERSION:    ${{ needs.version.outputs.cozy_de_version }}
          COZY_DE_TAG_EXISTS: ${{ needs.version.outputs.cozy_de_tag_exists }}
          COZY_DE_CHANGED:    ${{ needs.version.outputs.cozy_de_changed }}
        run: |
          set -euo pipefail

          held=""
          lines=""
          # $1 keymap, $2 version, $3 did it change, $4 is its tag already out there
          note_held() {
            if [ "$3" = true ] && [ "$4" = true ]; then
              held="$held $1-$2"
              lines="$lines
          - \`$1\` changed, but \`$2\` is already released, so no tag is created for it."
            fi
          }
          note_held cozy    "$COZY_VERSION"    "$COZY_CHANGED"    "$COZY_TAG_EXISTS"
          note_held cozy_de "$COZY_DE_VERSION" "$COZY_DE_CHANGED" "$COZY_DE_TAG_EXISTS"

          if [ -z "$held" ]; then
            echo 'Every changed keymap carries a version that was never released.'
            exit 0
          fi

          echo "::notice::Changed but already released:$held. Merging to main releases nothing for these; bump VERSION_STRING in the keymap.c of each if you want a release."
          {
            echo '### Not released'
            echo "$lines"
            echo
            echo "The firmware is in this run's artifacts either way. Bump \`VERSION_STRING\` for a release."
          } >> "$GITHUB_STEP_SUMMARY"

  # Replaces the old `publish` job, which only ran for pushed tags: `main` creates its own tags
  # now. A push whose changed keymaps all still carry released versions releases nothing and
  # skips this job entirely, which is how a comment-only change stays free.
  release:
    name: 'Tag and release'
    needs: [version, package, key-override-tests]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.any_release == 'true'
    runs-on: ubuntu-latest
    env:
      COZY_VERSION:    ${{ needs.version.outputs.cozy_version }}
      COZY_CHANGED:    ${{ needs.version.outputs.cozy_changed }}
      COZY_RELEASE:    ${{ needs.version.outputs.cozy_release }}
      COZY_DE_VERSION: ${{ needs.version.outputs.cozy_de_version }}
      COZY_DE_CHANGED: ${{ needs.version.outputs.cozy_de_changed }}
      COZY_DE_RELEASE: ${{ needs.version.outputs.cozy_de_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the packaged cozy firmware
        uses: actions/download-artifact@v4
        with:
          name: iris-cozy-${{ needs.version.outputs.cozy_version }}
          path: dist

      - name: Download the packaged cozy_de firmware
        uses: actions/download-artifact@v4
        with:
          name: iris-cozy-de-${{ needs.version.outputs.cozy_de_version }}
          path: dist

      # One tag per keymap that changed *and* was bumped, all on this commit. The `version` job
      # checked that these tags did not exist, but that was several minutes and one firmware
      # build ago, so check again here rather than trusting the earlier answer.
      - name: Create the tags
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          create_tag() {
            tag=$1
            existing=$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')
            if [ -z "$existing" ]; then
              existing=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
            fi
            if [ -n "$existing" ]; then
              if [ "$existing" = "$GITHUB_SHA" ]; then
                echo "Tag $tag already points at $GITHUB_SHA; leaving it alone."
                return 0
              fi
              echo "::error::Tag $tag already exists and points at $existing, not at $GITHUB_SHA."
              return 1
            fi
            git tag -a "$tag" -m "Firmware $tag"
            git push origin "refs/tags/$tag"
          }

          if [ "$COZY_RELEASE" = true ]; then
            create_tag "cozy-$COZY_VERSION"
          fi
          if [ "$COZY_DE_RELEASE" = true ]; then
            create_tag "cozy_de-$COZY_DE_VERSION"
          fi

      # Both keymaps are released together even when only one of them got a tag, so a release is
      # always a complete set of firmware. That means one of the two files can carry a version
      # that an earlier release already carried; the release date and tag tell them apart.
      - name: Describe the release
        id: describe
        run: |
          set -euo pipefail

          # One release, on the first tag created, in a fixed keymap order so that which tag
          # carries it never depends on anything but which keymaps were released.
          if [ "$COZY_RELEASE" = true ]; then
            tag="cozy-$COZY_VERSION"
          else
            tag="cozy_de-$COZY_DE_VERSION"
          fi

          # Two ways to end up in a release without a tag of your own: untouched, or touched
          # without a version bump. The second one is worth saying out loud, because the file
          # then differs from the identically versioned one in an earlier release.
          note_for() {
            if [ "$1" = true ]; then
              printf ''
            elif [ "$2" = true ]; then
              printf ' (changed, but its version was not bumped, so it got no tag of its own)'
            else
              printf ' (unchanged since its own release)'
            fi
          }
          cozy_note=$(note_for "$COZY_RELEASE" "$COZY_CHANGED")
          cozy_de_note=$(note_for "$COZY_DE_RELEASE" "$COZY_DE_CHANGED")

          {
            echo "tag=$tag"
            echo "name=cozy $COZY_VERSION / cozy_de $COZY_DE_VERSION"
            echo 'body<<RELEASE_BODY_EOF'
            echo 'Firmware in this release:'
            echo
            echo "- \`cozy\`: **$COZY_VERSION**$cozy_note"
            echo "- \`cozy_de\`: **$COZY_DE_VERSION**$cozy_de_note"
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
            token: ${{ github.token }}
            tag_name: ${{ steps.describe.outputs.tag }}
            name: ${{ steps.describe.outputs.name }}
            body: ${{ steps.describe.outputs.body }}
            fail_on_unmatched_files: true
            files: dist/*.uf2
